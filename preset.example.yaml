# 지인 배포용 프리셋. 이 파일을 preset.yaml 로 복사해서 값을 채우고
#   build.bat --preset preset.yaml
# 로 빌드하면, 받은 사람은 exe 실행 → 시작만 누르면 됩니다.
# ※ 토큰이 들어가므로 preset.yaml 과 빌드 결과물을 공개된 곳에 올리지 마세요.

lock_translator: true          # 설정 창에서 번역 항목을 숨기고 아래 값으로 고정

translator:
  engine: relay
  relay_url: http://193.123.163.59:8787
  relay_token: ""              # 서버 .env 의 RELAY_TOKENS 중 하나
  formality: default           # 친구들끼리면 prefer_less(반말)도 괜찮음

# 친구들 기본값도 여기서 바꿀 수 있음 (사용자가 설정 창에서 바꾸면 그게 우선)
# overlay:
#   mode: desktop
